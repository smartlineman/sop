<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Transformer Oil Sampling Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 36px; line-height: 1.5; }
        h1 { color: #2f3640; }
        label { display: block; margin-top: 12px; }
        input, textarea { width: 100%; padding: 8px; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>Transformer Oil Sampling Form</h1>
    <label>Substation / Feeder</label>
    <input type="text" placeholder="Name / ID" />

    <label>Equipment Details</label>
    <textarea rows="4" placeholder="DTR rating, serial number, location"></textarea>

    <label>Sampling Date &amp; Time</label>
    <input type="text" placeholder="DD-MM-YYYY HH:MM" />

    <label>Observations</label>
    <textarea rows="5" placeholder="Color, smell, leakage, etc."></textarea>

    <p>Collected By: ____________________  Contact: ____________________</p>
</body>
</html>
