<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>LT Service Checklist</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 36px; line-height: 1.5; }
        h1 { color: #2c3e50; }
        ul { list-style: square; }
        .section { margin-bottom: 24px; }
    </style>
</head>
<body>
    <h1>LT Service Checklist</h1>
    <div class="section">
        <h2>Preliminary Checks</h2>
        <ul>
            <li>Verify customer complaint and service ID</li>
            <li>Inspect pillar box and outgoing fuses</li>
            <li>Ensure PPE and safety cones deployed</li>
        </ul>
    </div>
    <div class="section">
        <h2>Testing</h2>
        <ul>
            <li>Measure voltage at pillar and consumer end</li>
            <li>Check neutral continuity</li>
            <li>Log load balancing observations</li>
        </ul>
    </div>
</body>
</html>
