<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>11kV PTW Template</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.5; }
        h1 { color: #2c3e50; }
        .section { margin-bottom: 24px; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        textarea { width: 100%; min-height: 80px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        table, th, td { border: 1px solid #ccc; }
        th, td { padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <h1>11kV Permit To Work (PTW)</h1>
    <div class="section">
        <label>Feeder / Bay</label>
        <textarea placeholder="Enter feeder or bay details"></textarea>
        <label>Reason for PTW</label>
        <textarea placeholder="Describe maintenance / isolation reason"></textarea>
    </div>
    <div class="section">
        <h2>Isolation Checklist</h2>
        <table>
            <tr><th>Step</th><th>Status</th><th>Remarks</th></tr>
            <tr><td>Breaker opened</td><td></td><td></td></tr>
            <tr><td>Earth switch engaged</td><td></td><td></td></tr>
            <tr><td>Line tested for absence of voltage</td><td></td><td></td></tr>
        </table>
    </div>
    <div class="section">
        <label>Authorized by</label>
        <textarea></textarea>
        <label>Issued to</label>
        <textarea></textarea>
    </div>
</body>
</html>
